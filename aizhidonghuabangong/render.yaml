# render.yaml — Render 平台部署配置
# 参考文档：https://render.com/docs/blueprint-spec

services:
  - type: web
    name: office-automation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: office-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: office-db
    plan: free
    databaseName: office_automation